global:
  podSecurityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

crds:
  create: false

alloy:
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      otelcol.receiver.otlp "applications" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [
            otelcol.processor.memory_limiter.traces.input,
          ]
        }
      }

      otelcol.processor.memory_limiter "traces" {
        check_interval = "1s"
        limit          = "384MiB"
        spike_limit    = "128MiB"

        output {
          traces = [
            otelcol.processor.batch.traces.input,
          ]
        }
      }

      otelcol.processor.batch "traces" {
        timeout         = "5s"
        send_batch_size = 512

        output {
          traces = [
            otelcol.exporter.otlp.jaeger.input,
          ]
        }
      }

      otelcol.exporter.otlp "jaeger" {
        client {
          endpoint = "jaeger.opentelemetry.svc.cluster.local:4317"

          tls {
            insecure = true
          }
        }
      }

  clustering:
    enabled: false

  stabilityLevel: generally-available
  storagePath: /tmp/alloy
  enableReporting: false

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
      appProtocol: http

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  mounts:
    extra:
      - name: alloy-storage
        mountPath: /tmp/alloy

configReloader:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 128Mi

controller:
  type: deployment
  replicas: 1

  podLabels:
    app.kubernetes.io/component: collector

  volumes:
    extra:
      - name: alloy-storage
        emptyDir:
          sizeLimit: 256Mi

rbac:
  create: false

serviceAccount:
  create: true
  automountServiceAccountToken: false

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  enabled: false
