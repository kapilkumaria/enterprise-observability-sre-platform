apiVersion: platform.kapilkumaria.com/v1alpha1
kind: ObservabilityDependencyCatalog
metadata:
  name: enterprise-observability-dependencies
spec:
  charts:
    kubePrometheusStack:
      repository: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      chartVersion: 88.5.4
      applicationVersion: v0.93.1
      namespace: observability
      syncWave: "30"

    loki:
      repository: https://grafana.github.io/helm-charts
      chart: loki
      chartVersion: 7.3.0
      applicationVersion: 3.6.12
      namespace: observability
      syncWave: "40"

    alloy:
      repository: https://grafana.github.io/helm-charts
      chart: alloy
      chartVersion: 1.12.1
      applicationVersion: v1.19.2
      namespace: observability
      syncWave: "45"

    jaeger:
      repository: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      chartVersion: 4.12.0
      applicationVersion: 2.20.0
      namespace: observability
      syncWave: "50"

    opentelemetryCollector:
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      chartVersion: 0.171.0
      applicationVersion: 0.158.0
      namespace: opentelemetry
      syncWave: "60"
