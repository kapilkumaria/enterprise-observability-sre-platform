apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability-platform
  namespace: argocd
  labels:
    app.kubernetes.io/name: observability-platform
    app.kubernetes.io/part-of: enterprise-observability-sre-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  description: GitOps project for the enterprise observability and SRE platform

  sourceRepos:
    - https://github.com/kapilkumaria/enterprise-observability-sre-platform.git
    - https://prometheus-community.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: applications
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: opentelemetry

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: false
