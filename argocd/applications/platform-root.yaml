apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-root
    app.kubernetes.io/part-of: enterprise-observability-sre-platform
    app.kubernetes.io/managed-by: kubectl
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-platform

  source:
    repoURL: https://github.com/kapilkumaria/enterprise-observability-sre-platform.git
    targetRevision: main
    path: gitops/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
