apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-otlp-egress
  namespace: applications
  labels:
    app.kubernetes.io/name: allow-application-otlp-egress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      observability.kapilkumaria.com/export-otlp: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/component: collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-otlp-ingress
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: allow-application-otlp-ingress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: applications
          podSelector:
            matchLabels:
              observability.kapilkumaria.com/export-otlp: "true"
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
