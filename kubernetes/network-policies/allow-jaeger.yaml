apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-jaeger-metrics-egress
  namespace: observability
  labels:
    app.kubernetes.io/name: allow-prometheus-jaeger-metrics-egress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack-prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
              app.kubernetes.io/instance: jaeger
              app.kubernetes.io/component: all-in-one
      ports:
        - protocol: TCP
          port: 8888
---
