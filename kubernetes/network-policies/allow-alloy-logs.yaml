apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-logs-kubernetes-api-egress
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: allow-alloy-logs-kubernetes-api-egress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-logs
      app.kubernetes.io/component: log-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-logs-loki-egress
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: allow-alloy-logs-loki-egress
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-logs
      app.kubernetes.io/component: log-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 80
---
