apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-operator-webhook
  namespace: observability
  labels:
    app.kubernetes.io/name: allow-prometheus-operator-webhook
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
      release: kube-prometheus-stack

  policyTypes:
    - Ingress

  ingress:
    - from:
        - ipBlock:
            cidr: 10.60.0.0/16
      ports:
        - protocol: TCP
          port: 10250
