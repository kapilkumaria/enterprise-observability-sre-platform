apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-kubernetes-api
  namespace: observability
  labels:
    app.kubernetes.io/name: allow-observability-kubernetes-api
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  podSelector: {}

  policyTypes:
    - Egress

  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
        - ipBlock:
            cidr: 10.60.0.0/16
      ports:
        - protocol: TCP
          port: 443
