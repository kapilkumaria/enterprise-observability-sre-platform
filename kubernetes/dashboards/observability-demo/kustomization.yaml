apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: observability-demo
    app.kubernetes.io/instance: observability-demo
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: enterprise-observability-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    grafana_folder: Application Services

configMapGenerator:
  - name: observability-demo-dashboard
    files:
      - observability-demo.json=dashboard.json
