apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: observability-demo
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-demo
    app.kubernetes.io/instance: observability-demo
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  namespaceSelector:
    matchNames:
      - applications

  selector:
    matchLabels:
      app.kubernetes.io/name: observability-demo
      app.kubernetes.io/instance: observability-demo

  endpoints:
    - port: http
      path: /metrics/
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
