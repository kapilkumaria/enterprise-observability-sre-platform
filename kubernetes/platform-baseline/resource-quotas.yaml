apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
  labels:
    app.kubernetes.io/component: resource-governance
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 16Gi
    limits.cpu: "10"
    limits.memory: 24Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    configmaps: "100"
    secrets: "100"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opentelemetry-quota
  namespace: opentelemetry
  labels:
    app.kubernetes.io/component: resource-governance
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.cpu: "5"
    limits.memory: 12Gi
    requests.storage: 40Gi
    persistentvolumeclaims: "10"
    pods: "60"
    services: "20"
    configmaps: "50"
    secrets: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: applications-quota
  namespace: applications
  labels:
    app.kubernetes.io/component: resource-governance
    app.kubernetes.io/part-of: enterprise-observability-platform
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.storage: 20Gi
    persistentvolumeclaims: "5"
    pods: "40"
    services: "20"
    configmaps: "40"
    secrets: "40"
