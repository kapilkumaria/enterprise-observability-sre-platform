    app.kubernetes.io/instance: observability-demo
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: enterprise-observability-platform
    app.kubernetes.io/version: 28d32bf1a172
  annotations:
    platform.kapilkumaria.com/source-revision: 28d32bf1a172de51243c50da3318e4522c514f2d
    platform.kapilkumaria.com/image-digest: sha256:370f330f266f3ec77a4818633d4714744397867f9fe055e432b9c6295323357a
