      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: observability-demo
              app.kubernetes.io/instance: observability-demo
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: observability-demo
              app.kubernetes.io/instance: observability-demo
      containers:
        - name: observability-demo
          image: 931058976119.dkr.ecr.us-east-1.amazonaws.com/enterprise-observability/observability-demo@sha256:370f330f266f3ec77a4818633d4714744397867f9fe055e432b9c6295323357a
          imagePullPolicy: IfNotPresent
          ports:
