apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: telemetry-collector
    app.kubernetes.io/part-of: enterprise-observability-sre-platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-platform

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy-collector
        valueFiles:
          - $values/helm/alloy/values.yaml

    - repoURL: https://github.com/kapilkumaria/enterprise-observability-sre-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
