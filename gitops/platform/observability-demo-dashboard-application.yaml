apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-demo-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    app.kubernetes.io/name: observability-demo-dashboard
    app.kubernetes.io/part-of: enterprise-observability-sre-platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-platform

  source:
    repoURL: https://github.com/kapilkumaria/enterprise-observability-sre-platform.git
    targetRevision: main
    path: kubernetes/dashboards/observability-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
